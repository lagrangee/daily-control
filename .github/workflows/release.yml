name: Release standalone Skill

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Match tag to Skill version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          skill_version="$(sed -n 's/^  version: "\([^"]*\)"$/\1/p' skills/daily-control/SKILL.md)"
          if [[ -z "$skill_version" || "$tag_version" != "$skill_version" ]]; then
            echo "Tag version $tag_version does not match Skill version $skill_version" >&2
            exit 1
          fi

      - name: Build standalone archive
        shell: bash
        run: |
          archive="daily-control-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$archive" -C skills daily-control
          sha256sum "$archive" > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "daily-control-${GITHUB_REF_NAME}.tar.gz"
          SHA256SUMS
          --generate-notes
          --verify-tag
